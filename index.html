<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Odd Egg Hatchery</title>
<style>
:root{--ink:#3B2A4A;--cream:#FFF6E5;--paper:#fff;--coral:#FF7A59;--teal:#2BB5A0;--sun:#FFC93C;--lav:#B79CFF;--sky:#5BC0EB;--good:#1F8A5B;--bad:#C8443F;--muted:#6F5F7D}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Arial Rounded MT Bold",ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background-color:var(--cream);
  background-image:radial-gradient(circle at 10% 16%,#FFE3B8 0 13%,transparent 13.5%),radial-gradient(circle at 90% 10%,#D9F3EC 0 11%,transparent 11.5%),radial-gradient(circle at 84% 88%,#E9E0FF 0 15%,transparent 15.5%),radial-gradient(circle at 6% 90%,#FFDCD2 0 10%,transparent 10.5%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;line-height:1.35}
#app{max-width:980px;margin:0 auto;padding:18px 18px 60px}
h1,h2,h3,p{margin:0}
h1{font-size:1.5rem;letter-spacing:.01em}
h2{font-size:1.35rem;margin-bottom:12px}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:1rem;white-space:nowrap}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:22px;margin-bottom:22px}
.btn{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:.6em 1.1em;font-size:1.05rem;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{background:#FFF1CC}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.pcard:focus-visible,.slot:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.btn.big{font-size:1.5rem;background:var(--sun);padding:.55em 1.3em}
.btn.big:hover{background:#FFD765}
.btn.sm{font-size:.95rem;padding:.35em .8em;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.live{background:#C9F2E8}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.tiny{font-size:.9rem;color:var(--muted);margin-top:8px}
.warn{color:var(--bad)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#FFFBF2}
.hello{font-size:2rem}
.lead{font-size:1.15rem;margin:6px 0 18px;max-width:30ch}
.heroart{flex:none}
.bar{height:26px;border:3px solid var(--ink);border-radius:999px;background:#F1ECF5;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--teal) 0 14px,#49C7B3 14px 28px);border-right:3px solid var(--ink);min-width:0}
.bar i[style="width:0%"]{border-right:0}
.stages{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 4px;font-size:1rem}
.stages b{font-size:1.2rem}
.tables{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:14px}
.tb{border:3px solid var(--ink);border-radius:14px;text-align:center;padding:6px 2px;background:#F6F2FA;font-size:.9rem}
.tb b{display:block;font-size:1.1rem}
.tb.done{background:var(--sun)}
.parade{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFFBF2;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:16px;cursor:pointer;font-size:1rem}
.pcard b{font-size:1.4rem}
.pcard:hover{background:#FFF1CC}
.pcard.add{justify-content:center;border-style:dashed;min-height:200px}
.plus{font-size:3rem;line-height:1}
.form{display:flex;flex-direction:column;gap:16px;max-width:520px}
.form label{font-size:1.1rem}
.form input[type=text]{font:inherit;font-size:1.4rem;padding:.4em .6em;border:3px solid var(--ink);border-radius:14px;width:100%;margin-top:6px;background:#fff;color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick label{display:block;border:3px solid var(--ink);border-radius:16px;padding:12px;cursor:pointer;background:#fff}
.pick input{position:absolute;opacity:0}
.pick label:has(input:checked){background:var(--sun);box-shadow:0 4px 0 var(--ink)}
.pick label:has(input:focus-visible){outline:4px solid var(--sky);outline-offset:3px}
.pick b{display:block;font-size:1.2rem}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dots i.on{background:var(--teal)}
.dots i.cur{background:var(--sun);transform:scale(1.25)}
.stage{text-align:center;padding:26px 18px 30px;background:#FFFBF2}
.nest{height:250px;display:flex;align-items:flex-end;justify-content:center}
.bubble{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 16px;margin:14px auto 8px;font-size:1.15rem;max-width:52ch}
.q{font-size:clamp(3rem,9vw,5.2rem);display:flex;gap:.28em;align-items:center;justify-content:center;line-height:1.1}
.q .op{color:var(--coral)}
.minus{display:inline-block;width:.5em;height:.13em;border-radius:.07em;background:currentColor;vertical-align:.28em}
.box{display:inline-block;min-width:2.3ch;padding:0 .18em;border:4px dashed var(--ink);border-radius:18px;background:#fff;min-height:1.15em;text-align:center}
.box.ask::after{content:"";display:inline-block;width:.07em;height:.8em;background:var(--ink);margin-left:.04em;vertical-align:-.06em;animation:blink 1s steps(2) infinite}
.box.good{border-style:solid;background:#D8F5E7;color:var(--good)}
.tag{display:inline-block;background:var(--lav);border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:.9rem;margin-bottom:6px}
.tag.lock{background:#E6E0EC}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.quest{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:1rem}
.quest.done{color:var(--good)}
.mini{flex:none;width:72px;height:14px;border:2px solid var(--ink);border-radius:999px;background:#F1ECF5;overflow:hidden}
.mini i{display:block;height:100%;background:var(--sun)}
.levelup{text-align:center;background:#FFF1B8}
.hearts{font-size:1.4rem;letter-spacing:3px}
.sbarwrap{height:22px;border:3px solid var(--ink);border-radius:999px;background:#F1ECF5;overflow:hidden;margin-bottom:10px}
#sbar{height:100%;background:var(--coral);transition:width .2s linear}
.flash{color:var(--bad);font-size:1.6rem;min-height:1.5em}
.box.bad{border-style:solid;background:#FBE1DF;color:var(--bad)}
.q.word{font-size:clamp(1.8rem,5.5vw,3.2rem)}
.box.word{min-width:7ch;letter-spacing:.08em;padding:.12em .35em}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tiles span{min-width:1.7em;padding:4px 2px;border:3px solid var(--ink);border-radius:10px;font-size:1.5rem;text-align:center;background:#D8F5E7}
.tiles span.miss{background:#FBE1DF;color:var(--bad)}
.tiles.yours span{font-size:1.1rem;border-width:2px;background:#F1ECF5;color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.words span{border:2px solid var(--ink);border-radius:8px;padding:2px 8px;font-size:.9rem}
.hats b{align-self:center;min-width:4.5em;text-align:right}
.veil{position:fixed;inset:0;background:rgba(59,42,74,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;overflow:auto}
.veil .card{max-width:560px;width:100%;text-align:center;margin:auto}
.pop{animation:pop .28s cubic-bezier(.2,1.5,.4,1) both}
.bigfact{font-size:clamp(2.4rem,7vw,3.6rem);margin:6px 0 10px}
.bigfact b{color:var(--good)}
.trick{background:#FFF4CF;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;margin:12px 0;font-size:1.1rem;text-align:left}
.chain{font-size:1.05rem;color:var(--muted);margin-bottom:14px}
.chain b{color:var(--ink)}
.shout{font-size:2rem;margin-bottom:4px}
.petname{font-size:1.6rem;margin-top:4px}
.facts{font-size:1.05rem;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.slot{background:#FFFBF2;border:3px solid var(--ink);border-radius:18px;padding:8px 6px 10px;text-align:center;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:2px}
button.slot{cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button.slot:hover{background:#FFF1CC}
.slot .f{font-size:1.05rem}
.slot.s0{background:#EEF3F7}
.slot.s4{background:#DDF6EF}
.hats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.pgrid{border-collapse:separate;border-spacing:3px;margin:8px 0 14px}
.pgrid th{font-size:.85rem;width:30px;height:24px}
.pgrid td{width:30px;height:30px;border-radius:7px;border:2px solid var(--ink);font-size:.72rem;text-align:center}
.s0c{background:#E6EDF3}.s1c{background:#FFE2A8}.s2c{background:#FFC27A}.s3c{background:#9FE0D2}.s4c{background:#2BB5A0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.9rem;margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:16px;border-radius:5px;border:2px solid var(--ink);display:inline-block}
.gridwrap{display:flex;gap:28px;flex-wrap:wrap}
table.log{border-collapse:collapse;width:100%;font-size:.95rem}
table.log th,table.log td{text-align:left;padding:6px 8px;border-bottom:2px solid #E8E0EE}
textarea{font:inherit;font-size:.8rem;font-family:ui-monospace,Menlo,monospace;width:100%;height:84px;border:3px solid var(--ink);border-radius:12px;padding:8px;color:var(--ink);background:#fff}
.cert{text-align:center;padding:36px 24px;background:#FFFBF2}
.cert h2{font-size:2.2rem}
.cert .who2{font-size:2.6rem;margin:10px 0;color:var(--coral)}
svg.pet{overflow:visible;flex:none}
.wobble{animation:wobble 1.6s ease-in-out infinite;transform-origin:50% 90%}
.st0.wobble{animation-duration:3.4s}
.bob{animation:bob 1.8s ease-in-out infinite}
.spin{animation:spin .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
@media (max-width:640px){.hero{flex-direction:column;text-align:center}.lead{margin-inline:auto}.tables{grid-template-columns:repeat(5,1fr)}.pick{grid-template-columns:1fr}.duo{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>

<body>
<div id="app"></div>

<script id="engine">
/* The learning engine. No screen code in here, so it can be tested on its own. */
const Engine = (() => {
  'use strict';
  const N = 10;
  const ROUND_LEN = 12;      // questions in one round
  const MAX_LEARNERS = 3;    // brand-new facts taught per round
  const MAX_SHAKY = 10;      // stop adding new facts while this many are still wobbly
  const FAST_MS = 5000;      // first-try answers this quick count as "already known"
  const SOLID_MS = 8000;     // a fact only counts as memorized if answered this quick
  const QUICK_MS = 3000;     // bonus seed
  const LEVEL_MAX = 20;
  const STARS = { step: 1, hatched: 3, grown: 6, badge: 10, quest: 5, boss: 15, best: 5 };
  const QUEST_SEEDS = 15, QUEST_BONUS = 25, BOSS_SEEDS = 40, BOSS_HEARTS = 3;
  const SPEED_LEVEL = 3, SPEED_MIN_POOL = 8, SPEED_SEED_CAP = 30;
  const TABLE_ORDER = [1, 10, 2, 5, 3, 4, 9, 6, 7, 8];
  const addTier = (a, b) => (a <= 2 || b === 10) ? 0 : a === b ? 1 : a + b <= 10 ? 2 : b - a === 1 ? 3 : 4;

  const NAMES = ['Wobble', 'Noodle', 'Pickle', 'Snorf', 'Blorp', 'Fizz', 'Mumble', 'Waffle', 'Bongo', 'Sprocket', 'Nugget',
    'Doodle', 'Squish', 'Toot', 'Gizmo', 'Bumble', 'Crumpet', 'Zonk', 'Flapjack', 'Snoot', 'Bloop', 'Twiddle', 'Gloop',
    'Pudding', 'Biscuit', 'Wiggle', 'Fuzzle', 'Honk', 'Sniffle', 'Turnip', 'Bagel', 'Noggin', 'Splat', 'Pogo', 'Dumpling',
    'Kazoo', 'Fidget', 'Muffin', 'Goober', 'Tumble', 'Zigzag', 'Pebble', 'Smudge', 'Hiccup', 'Boing', 'Radish', 'Tater',
    'Whiffle', 'Scooter', 'Jellybean', 'Marble', 'Crouton', 'Wonton', 'Plonk', 'Snickerdoodle'];

  function groupsOf(facts, kinds) {
    const out = [];
    for (const [kind, sym] of kinds) for (let t = 1; t <= N; t++) {
      out.push({ key: kind + t, label: sym + t, ids: facts.filter(f => f.kind === kind && (f.a === t || f.b === t)).map(f => f.id) });
    }
    return out;
  }
  function makeSubject(name, blurb, goal, facts, kinds, groups) {
    facts.sort((p, q) => p.rank - q.rank || p.size - q.size || p.a - q.a);
    const byId = {}, idx = {};
    facts.forEach((f, i) => { byId[f.id] = f; idx[f.id] = i; });
    return { name, blurb, goal, facts, byId, idx, groups: groups || groupsOf(facts, kinds) };
  }
  const times = [], plusminus = [];
  for (let a = 1; a <= N; a++) for (let b = a; b <= N; b++) {
    times.push({ id: a + 'x' + b, kind: 'x', a, b, size: a * b, rank: Math.min(TABLE_ORDER.indexOf(a), TABLE_ORDER.indexOf(b)) });
    plusminus.push({ id: a + '+' + b, kind: '+', a, b, size: a + b, rank: addTier(a, b) });
    plusminus.push({ id: a + '-' + b, kind: '-', a, b, size: a + b, rank: addTier(a, b) + 0.5 });
  }
  // Word lists run from easier to harder. No sound-alike pairs (their/there), because she only hears the word.
  const WORDS3 = ('said they were what when want does goes come give have many any friend people because again could should little ' +
    'school about other every always around before another thought enough laugh family pretty special favorite different together between important question ' +
    'surprise picture beautiful believe breakfast island minute answer strange busy early earth learn heart guess bought brought daughter calendar neighbor').split(' ');
  const WORDS5 = ('climb forty height certain develop column ancient breathe although language familiar foreign excellent especially experience explanation dictionary disappear business character ' +
    'community curiosity definite desperate frequently government knowledge lightning interrupt immediately independent environment necessary occasion opportunity particular persuade physical recognize recommend ' +
    'restaurant separate sincerely temperature thorough vegetable committee conscience yacht embarrass exaggerate guarantee mischievous occurred parallel privilege pronunciation rhythm rhyme vacuum').split(' ');
  function spelling(tag, name, blurb, goal, words) {
    const facts = words.map((word, i) => ({ id: tag + ':' + word, kind: 'w', word, a: 0, b: 0, size: 0, rank: i }));
    const groups = [];
    for (let i = 0; i < words.length; i += N) groups.push({ key: tag + '-' + (i / N + 1), label: 'Set ' + (i / N + 1), ids: words.slice(i, i + N).map(w => tag + ':' + w) });
    return makeSubject(name, blurb, goal, facts, [], groups);
  }
  const SUBJECTS = {
    times: makeSubject('Times tables', '1 × 1 up to 10 × 10', 'all the times tables from 1 × 1 to 10 × 10', times, [['x', '×']]),
    plusminus: makeSubject('Adding and subtracting', 'Sums up to 20', 'every adding and subtracting fact up to 20', plusminus, [['+', '+'], ['-', '−']]),
    spell3: spelling('w3', 'Spelling: starter words', '60 words, around grade 3', 'how to spell all 60 starter words', WORDS3),
    spell5: spelling('w5', 'Spelling: tricky words', '60 words, around grade 5', 'how to spell all 60 tricky words', WORDS5),
  };
  function find(id) {
    for (const key in SUBJECTS) if (SUBJECTS[key].byId[id]) return { fact: SUBJECTS[key].byId[id], subject: key, idx: SUBJECTS[key].idx[id] };
    return null;
  }

  /* One fact can be asked two ways round (7 × 8 or 8 × 7; 15 − 7 or 15 − 8). */
  function pose(f, flip) {
    if (f.kind === 'w') return { x: '', op: '', y: '', ans: f.word };
    if (f.kind === 'x') return { x: flip ? f.b : f.a, op: '×', y: flip ? f.a : f.b, ans: f.a * f.b };
    if (f.kind === '+') return { x: flip ? f.b : f.a, op: '+', y: flip ? f.a : f.b, ans: f.a + f.b };
    return { x: f.a + f.b, op: '−', y: flip ? f.b : f.a, ans: flip ? f.a : f.b };
  }

  const same = (given, ans) => typeof ans === 'number' ? Number(given) === ans : String(given).trim().toLowerCase() === ans;
  // Typing a word takes longer than typing a number, so spelling gets more time per letter.
  const limits = q => q.kind === 'w'
    ? { fast: 4000 + 800 * q.ans.length, solid: 7000 + 1000 * q.ans.length, quick: 2500 + 450 * q.ans.length }
    : { fast: FAST_MS, solid: SOLID_MS, quick: QUICK_MS };

  function dayStart(now, plus = 0) { const d = new Date(now); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + plus).getTime(); }
  function dateKey(now) { const d = new Date(now), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }

  /* Stages: 0 cold egg, 1 warm egg, 2 cracking egg, 3 hatchling, 4 grown up (memorized). */
  function newSave(now, subject, name) {
    const facts = {};
    for (const f of SUBJECTS[subject].facts) facts[f.id] = { s: 0, due: 0, seen: 0, r: 0, w: 0, last: 0 };
    return { id: 'p' + now + Math.floor(Math.random() * 1e6), name: name || 'Keeper', subject, created: now, facts, seeds: 0, stars: 0, seenLevel: 1, owned: [], worn: {}, bed: '', quests: null, bosses: {}, speedBest: 0, speedDay: '', days: {}, badges: [], done: 0, tracks: {}, sound: true, mic: false };
  }
  /* One player can hatch several subjects. Seeds, stars, level, shop items, bed and quests are shared.
     The active subject's progress sits on the save itself; the others wait in save.tracks. */
  const TRACK_KEYS = ['facts', 'worn', 'badges', 'bosses', 'done', 'speedBest', 'speedDay'];
  function freshTrack(subject) {
    const facts = {};
    for (const f of SUBJECTS[subject].facts) facts[f.id] = { s: 0, due: 0, seen: 0, r: 0, w: 0, last: 0 };
    return { facts, worn: {}, badges: [], bosses: {}, done: 0, speedBest: 0, speedDay: '' };
  }
  const subjectsOf = save => Object.keys(SUBJECTS).filter(k => k === save.subject || (save.tracks && save.tracks[k]));
  function switchSubject(save, subject) {
    if (!SUBJECTS[subject] || subject === save.subject) return save;
    if (!save.tracks) save.tracks = {};
    const parked = {};
    for (const k of TRACK_KEYS) parked[k] = save[k];
    save.tracks[save.subject] = parked;
    const next = save.tracks[subject] || freshTrack(subject);
    delete save.tracks[subject];
    for (const k of TRACK_KEYS) save[k] = next[k];
    save.subject = subject;
    return save;
  }
  function repair(p, now) {
    if (!p || typeof p !== 'object' || !SUBJECTS[p.subject] || typeof p.facts !== 'object') return null;
    const base = newSave(now, p.subject, p.name);
    const out = Object.assign(base, p, { facts: base.facts });
    for (const id in base.facts) {
      const old = p.facts[id];
      if (old && typeof old === 'object') out.facts[id] = { s: Math.max(0, Math.min(4, old.s | 0)), due: +old.due || 0, seen: old.seen ? 1 : 0, r: old.r | 0, w: old.w | 0, last: +old.last || 0 };
    }
    for (const k of ['owned', 'badges']) if (!Array.isArray(out[k])) out[k] = [];
    for (const k of ['worn', 'days', 'bosses']) if (!out[k] || typeof out[k] !== 'object') out[k] = {};
    // saves from the first version: hats were the only thing to own, and a pet wore one hat
    if (Array.isArray(p.hats)) for (const h of p.hats) if (!out.owned.includes(h)) out.owned.push(h);
    delete out.hats;
    for (const id in out.worn) if (typeof out.worn[id] === 'string') out.worn[id] = { hat: out.worn[id] };
    out.seeds = Math.max(0, out.seeds | 0);
    if (typeof p.stars !== 'number') {
      out.stars = out.badges.length * STARS.badge;
      for (const id in out.facts) if (out.facts[id].s >= 3) out.stars += STARS.hatched + (out.facts[id].s === 4 ? STARS.grown : 0);
    }
    out.stars = Math.max(0, out.stars | 0);
    out.seenLevel = Math.max(1, Math.min(LEVEL_MAX, (out.seenLevel | 0) || 1));
    out.speedBest = Math.max(0, out.speedBest | 0);
    if (typeof out.bed !== 'string') out.bed = '';
    if (out.quests && (typeof out.quests !== 'object' || !Array.isArray(out.quests.list))) out.quests = null;
    if (typeof out.speedDay !== 'string') out.speedDay = '';
    out.done = +out.done || 0;
    const tracks = {};
    if (p.tracks && typeof p.tracks === 'object') for (const key in p.tracks) {
      const t = p.tracks[key];
      if (!SUBJECTS[key] || key === p.subject || !t || typeof t !== 'object') continue;
      const fixed = repair({ subject: key, name: 'x', stars: 0, facts: t.facts, worn: t.worn, badges: t.badges, bosses: t.bosses, done: t.done, speedBest: t.speedBest, speedDay: t.speedDay }, now);
      if (!fixed) continue;
      tracks[key] = {};
      for (const k of TRACK_KEYS) tracks[key][k] = fixed[k];

    out.name = String(out.name).slice(0, 16);
    return out;
  }

  function startRound() { return { asked: 0, len: ROUND_LEN, learners: [], retries: [], lastId: null, ok: 0, hatched: [], grown: [], seeds: 0 }; }

  function nextQuestion(save, round, now, rnd = Math.random) {
    if (round.asked >= round.len) return null;
    const S = SUBJECTS[save.subject], F = save.facts, cands = [];
    const waiting = id => round.retries.some(r => r.id === id);
    const add = (id, mode) => { if (!cands.some(c => c.id === id)) cands.push({ id, mode }); };
    // 1. facts she just missed, once a couple of other questions have gone by
    round.retries.filter(r => r.wait <= 0).forEach(r => add(r.id, r.mode));
    // 2. facts that are due for a check
    S.facts.filter(f => F[f.id].s >= 1 && F[f.id].due <= now && !waiting(f.id))
      .sort((p, q) => F[p.id].due - F[q.id].due).forEach(f => add(f.id, 'due'));
    // 3. new facts, a few at a time
    const shaky = S.facts.filter(f => F[f.id].s === 1 || F[f.id].s === 2).length;
    const fresh = S.facts.filter(f => F[f.id].s === 0 && !waiting(f.id));
    if (round.learners.length < MAX_LEARNERS && shaky < MAX_SHAKY) fresh.slice(0, 2).forEach(f => add(f.id, 'new'));
    // 4. missed facts that have not waited long enough yet
    round.retries.slice().sort((p, q) => p.wait - q.wait).forEach(r => add(r.id, r.mode));
    // 5. bonus practice on facts that are not due yet
    S.facts.filter(f => F[f.id].s >= 1 && F[f.id].s <= 3 && F[f.id].due > now)
      .sort((p, q) => F[p.id].s - F[q.id].s || F[p.id].last - F[q.id].last).forEach(f => add(f.id, 'practice'));
    S.facts.filter(f => F[f.id].s === 4 && F[f.id].due > now)
      .sort((p, q) => F[p.id].last - F[q.id].last).forEach(f => add(f.id, 'practice'));
    if (!cands.length) fresh.slice(0, 2).forEach(f => add(f.id, 'new'));
    if (!cands.length) return null;
    const pick = cands.find(c => c.id !== round.lastId) || cands[0];
    round.retries = round.retries.filter(r => r.id !== pick.id);
    round.retries.forEach(r => { r.wait--; });
    round.lastId = pick.id;
    round.asked++;
    const f = S.byId[pick.id];
    return Object.assign({ id: f.id, kind: f.kind, mode: pick.mode, stage: F[f.id].s }, pose(f, rnd() < 0.5));
  }

  function answer(save, round, q, given, ms, now) {
    const S = SUBJECTS[save.subject], f = save.facts[q.id], from = f.s, key = dateKey(now);
    const day = save.days[key] || (save.days[key] = { q: 0, ok: 0, rounds: 0, hatched: 0, grown: 0 });
    const correct = same(given, q.ans), lim = limits(q);
    const res = { correct, from, to: from, event: '', seeds: 0, stars: 0, badges: [], quests: [], allDone: false, quick: false };
    day.q++;
    f.last = now;
    if (!correct) {
      f.w++;
      if (from === 0) {
        if (!round.learners.includes(q.id)) round.learners.push(q.id);
        round.retries.push({ id: q.id, wait: 2, mode: 'new' });
        res.event = 'teach';
      } else {
        f.s = from === 4 ? 2 : Math.max(1, from - 1);
        f.due = now;
        round.retries.push({ id: q.id, wait: 2, mode: 'fix' });
        res.event = 'slipped';
      }
      f.seen = 1;
      res.to = f.s;
      ensureQuests(save, now).run = 0;
      return res;
    }
    f.r++; day.ok++; round.ok++;
    res.quick = ms <= lim.quick;
    res.seeds = 2 + (res.quick ? 1 : 0);
    if (q.mode === 'practice') { res.event = 'practice'; res.seeds = 1; }
    else if (q.mode === 'fix') { f.due = dayStart(now, 1); res.event = 'fixed'; }
    else if (from === 0) {
      if (!f.seen && ms <= lim.fast) { f.s = 3; f.due = dayStart(now, 1); res.event = 'placed'; }
      else {
        f.s = 1; f.due = now; res.event = 'warmed';
        if (!round.learners.includes(q.id)) round.learners.push(q.id);
        round.retries.push({ id: q.id, wait: 3, mode: 'again' });
      }
    }
    else if (from === 1) { f.s = 2; f.due = dayStart(now, 1); res.event = 'cracked'; }
    else if (from === 2) { f.s = 3; f.due = dayStart(now, 2); res.event = 'hatched'; }
    else if (from === 3) {
      if (ms <= lim.solid) { f.s = 4; f.due = dayStart(now, 7); res.event = 'grown'; }
      else { f.due = dayStart(now, 1); res.event = 'almost'; }
    }
    else { f.due = dayStart(now, 21); res.event = 'kept'; }
    f.seen = 1;
    res.to = f.s;
    if (res.event === 'placed' || res.event === 'hatched') { res.seeds += 5; day.hatched++; round.hatched.push(q.id); }
    if (res.event === 'grown') {
      res.seeds += 10; day.grown++; round.grown.push(q.id);
      for (const g of S.groups) {
        if (g.ids.includes(q.id) && !save.badges.includes(g.key) && g.ids.every(id => save.facts[id].s === 4)) {
          save.badges.push(g.key); res.badges.push(g.label); res.seeds += 25;
        }
      }
      if (S.facts.every(x => save.facts[x.id].s === 4)) { if (!save.done) save.done = now; res.allDone = true; }
    }
    const stepped = ['warmed', 'cracked', 'placed', 'hatched'].includes(res.event);
    const hatchedNow = res.event === 'placed' || res.event === 'hatched';
    res.stars = (hatchedNow ? STARS.hatched : res.event === 'grown' ? STARS.grown : stepped ? STARS.step : 0) + res.badges.length * STARS.badge;
    save.seeds += res.seeds; save.stars += res.stars;
    round.seeds += res.seeds; round.stars = (round.stars || 0) + res.stars;
    const qs = ensureQuests(save, now);
    qs.run++;
    const hit = (type, n, max) => res.quests.push(...questEvent(save, type, n, now, max));
    hit('right', 1); hit('streak', qs.run, true);
    if (res.quick) hit('quick', 1);
    if (stepped) hit('warm', 1);
    if (hatchedNow) hit('hatch', 1);
    if (res.event === 'grown') hit('grow', 1);
    return res;
  }

  function finishRound(save, round, now) {
    const key = dateKey(now);
    const day = save.days[key] || (save.days[key] = { q: 0, ok: 0, rounds: 0, hatched: 0, grown: 0 });
    day.rounds++;
    return questEvent(save, 'rounds', 1, now);
  }

  function stats(save, now) {
    const S = SUBJECTS[save.subject], by = [0, 0, 0, 0, 0];
    let due = 0;
    for (const f of S.facts) { const st = save.facts[f.id]; by[st.s]++; if (st.s >= 1 && st.due <= now) due++; }
    const played = Object.keys(save.days).filter(k => save.days[k].q > 0).sort();
    let streak = 0, d = now;
    if (!(save.days[dateKey(d)] && save.days[dateKey(d)].q)) d = dayStart(now, -1);
    while (save.days[dateKey(d)] && save.days[dateKey(d)].q > 0) { streak++; d = dayStart(d, -1); }
    let q = 0, ok = 0;
    for (const k of played) { q += save.days[k].q; ok += save.days[k].ok; }
    return {
      by, grown: by[4], total: S.facts.length, due, streak, days: played.length, q, ok,
      groups: S.groups.map(g => ({ key: g.key, label: g.label, of: g.ids.length, n: g.ids.filter(id => save.facts[id].s === 4).length })),
      tricky: S.facts.filter(f => save.facts[f.id].w > 0).sort((a, b) => save.facts[b.id].w - save.facts[a.id].w).slice(0, 6).map(f => f.id),
    };
  }

  /* Keeper levels. Stars only come from eggs moving forward, quests and bosses. */
  const starsFor = n => 3 * n * (n - 1);
  function levelInfo(stars) {
    let level = 1;
    while (level < LEVEL_MAX && stars >= starsFor(level + 1)) level++;
    const max = level === LEVEL_MAX;
    return { level, into: stars - starsFor(level), need: max ? 0 : starsFor(level + 1) - starsFor(level), max };
  }

  /* Three small goals a day, picked so that each one is possible today. */
  function ensureQuests(save, now) {
    const day = dateKey(now);
    if (save.quests && save.quests.day === day) return save.quests;
    const S = SUBJECTS[save.subject], F = save.facts, endOfDay = dayStart(now, 1);
    let h = 17;
    for (const ch of day + save.id) h = (Math.imul(h, 31) + ch.charCodeAt(0)) | 0;
    const rnd = () => ((h = (Math.imul(h, 1664525) + 1013904223) | 0) >>> 0) / 4294967296;
    const pick = a => a[Math.floor(rnd() * a.length)];
    const dueToday = stage => S.facts.filter(f => F[f.id].s === stage && F[f.id].due < endOfDay).length;
    const prog = [];
    if (S.facts.some(f => F[f.id].s <= 2)) prog.push(['warm', 3]);
    if (dueToday(2) >= 1) prog.push(['hatch', Math.min(2, dueToday(2))]);
    if (dueToday(3) >= 1) prog.push(['grow', 1]);
    if (bossList(save, now).some(b => b.canTry)) prog.push(['boss', 1]);
    if (speedOpen(save)) prog.push(['speed', 10]);
    if (!prog.length) prog.push(['right', 25]);
    const list = [pick([['rounds', 1], ['rounds', 2], ['right', 15]]), pick([['streak', 6], ['streak', 8], ['quick', 5], ['quick', 8]]), pick(prog)]
      .map(([type, goal]) => ({ type, goal, n: 0, done: false }));
    save.quests = { day, list, run: 0, bonus: false };
    return save.quests;
  }
  function questEvent(save, type, n, now, max) {
    const qs = ensureQuests(save, now), out = [];
    for (const q of qs.list) if (q.type === type && !q.done) {
      q.n = Math.min(q.goal, max ? Math.max(q.n, n) : q.n + n);
      if (q.n >= q.goal) { q.done = true; save.seeds += QUEST_SEEDS; save.stars += STARS.quest; out.push({ type: q.type, goal: q.goal }); }
    }
    if (out.length && !qs.bonus && qs.list.every(q => q.done)) { qs.bonus = true; save.seeds += QUEST_BONUS; out.push({ type: 'all', goal: qs.list.length }); }
    return out;
  }

  /* A missed fact in a challenge comes back in the next normal round. Challenges never move an egg forward. */
  function miss(save, id, now) { const f = save.facts[id]; f.w++; f.last = now; if (f.s >= 1 && f.due > now) f.due = now; }

  /* Boss eggs: one for each set of ten facts, once every egg in the set has hatched. One try a day. */
  function bossList(save, now) {
    const S = SUBJECTS[save.subject], today = dateKey(now);
    return S.groups.filter(g => !(save.bosses[g.key] && save.bosses[g.key].won) && g.ids.every(id => save.facts[id].s >= 3))
      .map(g => ({ key: g.key, label: g.label, canTry: !(save.bosses[g.key] && save.bosses[g.key].day === today) }));
  }
  function startBoss(save, key, now, rnd = Math.random) {
    const S = SUBJECTS[save.subject], g = S.groups.find(x => x.key === key), ids = g.ids.slice();
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const old = save.bosses[key] || {};
    save.bosses[key] = { won: old.won || 0, day: dateKey(now), tries: (old.tries | 0) + 1 };
    return { key, label: g.label, i: 0, hearts: BOSS_HEARTS, right: 0, qs: ids.map(id => Object.assign({ id, kind: S.byId[id].kind }, pose(S.byId[id], rnd() < 0.5))) };
  }
  function bossAnswer(save, boss, given, now) {
    const q = boss.qs[boss.i], correct = same(given, q.ans);
    const res = { correct, ans: q.ans, over: '', seeds: 0, stars: 0, quests: [] };
    if (correct) { boss.right++; res.seeds = 1; } else { boss.hearts--; miss(save, q.id, now); }
    boss.i++;
    if (boss.hearts <= 0) res.over = 'lose';
    else if (boss.i >= boss.qs.length) {
      res.over = 'win'; res.seeds += BOSS_SEEDS; res.stars = STARS.boss;
      save.bosses[boss.key].won = now;
    }
    save.seeds += res.seeds; save.stars += res.stars;
    if (res.over === 'win') res.quests = questEvent(save, 'boss', 1, now);
    return res;
  }

  /* Speed nest: a 60-second dash on facts that have already hatched. */
  const speedPool = save => SUBJECTS[save.subject].facts.filter(f => save.facts[f.id].s >= 3).map(f => f.id);
  const speedOpen = save => levelInfo(save.stars).level >= SPEED_LEVEL && speedPool(save).length >= SPEED_MIN_POOL;
  function speedQuestion(save, lastId, rnd = Math.random) {
    const S = SUBJECTS[save.subject], pool = speedPool(save).filter(id => id !== lastId);
    const id = pool[Math.floor(rnd() * pool.length)];
    return Object.assign({ id, kind: S.byId[id].kind }, pose(S.byId[id], rnd() < 0.5));
  }
  function speedFinish(save, score, now) {
    const day = dateKey(now), res = { score, best: false, seeds: 0, stars: 0, quests: [] };
    if (save.speedDay !== day) { res.seeds = Math.min(score, SPEED_SEED_CAP); save.speedDay = day; }
    if (score > save.speedBest) { res.best = true; if (score >= 5) res.stars = STARS.best; save.speedBest = score; }
    save.seeds += res.seeds; save.stars += res.stars;
    res.quests = questEvent(save, 'speed', score, now, true);
    return res;
  }

  /* Turn what the microphone heard into a number. Takes the last number in the sentence. */
  const UNITS = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  const TENS = { twenty: 20, thirty: 30, forty: 40, fourty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
  const SOUNDALIKE = { won: 1, to: 2, too: 2, tree: 3, free: 3, for: 4, fore: 4, sex: 6, sticks: 6, ate: 8, nein: 9, tin: 10 };
  function parseSpoken(text) {
    const toks = String(text).toLowerCase().replace(/(\d)([a-z])/g, '$1 $2').replace(/([a-z])(\d)/g, '$1 $2')
      .replace(/[^a-z0-9]+/g, ' ').split(' ').filter(Boolean);
    if (toks.length === 1 && toks[0] in SOUNDALIKE) return SOUNDALIKE[toks[0]];
    const out = [];
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (/^\d+$/.test(t)) out.push(Number(t));
      else if (t in TENS) { let v = TENS[t]; const n = UNITS[toks[i + 1]]; if (n >= 1 && n <= 9) { v += n; i++; } out.push(v); }
      else if (t in UNITS) out.push(UNITS[t]);
      else if (t === 'hundred') { if (out.length && toks[i - 1] === 'one') out[out.length - 1] = 100; else out.push(100); }
    }
    return out.length ? out[out.length - 1] : null;
  }

  return { SUBJECTS, NAMES, find, pose, dayStart, dateKey, newSave, repair, startRound, nextQuestion, answer, finishRound, stats, parseSpoken,
    ROUND_LEN, MAX_LEARNERS, FAST_MS, SOLID_MS, QUICK_MS, LEVEL_MAX, SPEED_LEVEL, BOSS_HEARTS, STARS,
    same, limits, switchSubject, subjectsOf, starsFor, levelInfo, ensureQuests, questEvent, miss, bossList, startBoss, bossAnswer, speedPool, speedOpen, speedQuestion, speedFinish };
})();

let ac = null;

function levelCard() {
  const lv = E.levelInfo(save.stars);
  if (lv.level <= save.seenLevel) return '';
  const fresh = ITEMS.filter(it => it.lvl > save.seenLevel && it.lvl <= lv.level && !save.owned.includes(it.id)).map(it => it.name);
  if (save.seenLevel < E.SPEED_LEVEL && lv.level >= E.SPEED_LEVEL) fresh.push('the speed nest');
  return `<section class="card levelup pop"><p class="shout">⭐ LEVEL UP! ⭐</p><p class="petname">Level ${lv.level}: ${RANKS[lv.level - 1]}</p>
    <p class="facts">${fresh.length ? 'Unlocked: ' + esc(fresh.slice(0, 5).join(', ')) + (fresh.length > 5 ? ` and ${fresh.length - 5} more` : '') + '.' : 'Keep hatching!'}</p>
    <button class="btn big" data-act="levelup">Woohoo! +${20 * (lv.level - save.seenLevel)} 🌱</button></section>`;
}

function vOverlay() {
  const q = ui.q, o = ui.overlay, s = spec(q.id), res = ui.res;
  const say = Mic.on ? ' or say “next”' : '';

    const lo = Math.min(q.x, q.y), hi = Math.max(q.x, q.y);
    const chain = q.kind === 'x' && lo > 1 ? `<p class="chain">Count by ${hi}s: ${Array.from({ length: lo }, (_, i) => i === lo - 1 ? `<b>${hi * (i + 1)}</b>` : hi * (i + 1)).join(', ')}</p>` : '';
    return `<div class="veil"><div class="card pop"><span class="tag">${esc(o.line)}</span>
      <div class="bigfact">${qHTML(q)}</div>${picture(q, o.given)}${q.kind === 'w' ? '<p><button class="btn sm" data-act="say">🔊 Hear it again</button></p>' : ''}

      <p class="facts"><b>${esc(qText(q))}</b><br>Likes: ${esc(s.hobby)}.<br>Scared of: ${esc(s.fear)}.</p>
      <p class="tiny" style="margin-bottom:12px">+${res.seeds} 🌱 +${res.stars} ⭐ &nbsp; It visits again ${when}. Answer right and it grows up.</p>${questLine(res.quests)}

  const badge = res.badges.map(b => `<p class="trick" style="text-align:center">🏅 You finished the whole <b>${esc(b)}</b> set! +25 🌱</p>`).join('');

}

function vBoss() {

    const closet = st === 4 ? (pickers || '<p class="tiny" style="margin-bottom:12px">Buy something in the shop and it can wear it.</p>') : '<p class="tiny" style="margin-bottom:12px">Outfits fit once it is all grown up.</p>';
    detail = `<div class="veil" data-act="close"><div class="card pop">${creatureSVG(id, st, { size: 180, cls: 'bob', bed: save.bed, wear: worn })}
      <p class="petname">${esc(s.name)}</p><p class="facts"><b>${factText(id, true)}</b><br>Likes: ${esc(s.hobby)}.<br>Scared of: ${esc(s.fear)}.<br>${st === 4 ? '⭐ All grown up' : '🐣 Hatchling'}</p>${closet}
      <button class="btn" data-act="close">Close</button></div></div>`;
  }
  return backBar('Pet book') + sections + detail;
}
const canBuy = it => !save.owned.includes(it.id) && save.seeds >= it.price && E.levelInfo(save.stars).level >= it.lvl;
function vShop() {
  const S = E.SUBJECTS[save.subject], lv = E.levelInfo(save.stars).level;
  const model = (S.facts.find(f => save.facts[f.id].s === 4) || S.facts.find(f => save.facts[f.id].s === 3) || S.facts[0]).id;
  const egg = (S.facts.find(f => save.facts[f.id].s <= 2) || S.facts[0]).id;
  const tabs = SHELVES.map(([k, label]) => `<button class="btn sm ${ui.shopTab === k ? 'live' : ''}" data-act="tab" data-tab="${k}">${label}</button>`).join('');
  const items = ITEMS.filter(it => it.kind === ui.shopTab).map(it => {
    const own = save.owned.includes(it.id);
    const art = it.kind === 'bed' ? creatureSVG(egg, 1, { size: 96, bed: it.id }) : creatureSVG(model, 4, { size: 96, wear: { [it.kind]: it.id } });
    const action = own ? (it.kind === 'bed' ? `<button class="btn sm ${save.bed === it.id ? 'live' : ''}" data-act="usebed" data-item="${it.id}">${save.bed === it.id ? 'In use' : 'Use it'}</button>` : '<span class="tag">Yours</span>')
      : lv < it.lvl ? `<span class="tag lock">🔒 Level ${it.lvl}</span>`
      : `<button class="btn sm" data-act="buy" data-item="${it.id}" ${save.seeds < it.price ? 'disabled' : ''}>🌱 ${it.price}</button>`;
    return `<div class="slot">${art}<b>${it.name}</b>${action}</div>`;
  }).join('');
  const blurb = ui.shopTab === 'bed' ? 'Buy a bed and every egg in your hatchery sleeps in it.' : 'A grown-up pet can wear one hat, one face thing, one outfit and one bag. Dress your pets in the pet book.';
  return backBar('Shop') + `<div class="row" style="margin-bottom:14px">${tabs}</div><section class="card"><p class="lead" style="max-width:none">${blurb}</p><div class="grid">${items}</div></section>`;
}
function vGrownups() {
  const now = Date.now(), st = E.stats(save, now), S = E.SUBJECTS[save.subject];
  const kinds = save.subject === 'times' ? [['x', '×']] : [['+', '+'], ['-', '−']];
  const nums = Array.from({ length: 10 }, (_, i) => i + 1);
  const grids = isSpelling() ? `<div class="words">${S.facts.map(f => `<span class="s${save.facts[f.id].s}c" title="right ${save.facts[f.id].r}, wrong ${save.facts[f.id].w}">${f.word}</span>`).join('')}</div>` : kinds.map(([k, sym]) => `<div><table class="pgrid" aria-label="Progress for ${sym}"><tr><th>${sym}</th>${nums.map(n => `<th>${n}</th>`).join('')}</tr>${nums.map(a => `<tr><th>${a}</th>${nums.map(b => { const id = Math.min(a, b) + k + Math.max(a, b), f = save.facts[id]; return `<td class="s${f.s}c" title="${factText(id, true)}: right ${f.r}, wrong ${f.w}"></td>`; }).join('')}</tr>`).join('')}</table></div>`).join('');
  const days = Object.keys(save.days).sort().reverse().slice(0, 14);
  const log = days.length ? `<table class="log"><tr><th>Day</th><th>Rounds</th><th>Questions</th><th>Right</th><th>Hatched</th><th>Memorized</th></tr>${days.map(k => { const d = save.days[k]; return `<tr><td>${k}</td><td>${d.rounds}</td><td>${d.q}</td><td>${d.q ? Math.round(d.ok / d.q * 100) : 0}%</td><td>${d.hatched}</td><td>${d.grown}</td></tr>`; }).join('')}</table>` : '<p class="tiny">No rounds played yet.</p>';
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(root))));
  return backBar('For grown-ups') + `
  <section class="card"><h2>${esc(save.name)}: ${S.name}</h2>
    ${E.subjectsOf(save).length > 1 ? `<p class="tiny" style="margin:0 0 10px">${esc(save.name)} is hatching ${E.subjectsOf(save).length} things. This page shows ${S.name}. Switch on the home screen to see the others. Seeds, stars and level are shared.</p>` : ''}
    <p><b>${st.grown} of ${st.total}</b> facts memorized. ${st.by[3]} nearly there, ${st.by[1] + st.by[2]} being learned, ${st.by[0]} not started. Played on ${plural(st.days, 'day')}; ${st.q ? Math.round(st.ok / st.q * 100) : 0}% right overall.</p>
    <p style="margin-top:8px">Level ${E.levelInfo(save.stars).level} with ${plural(save.stars, 'star')}. Boss eggs beaten: ${S.groups.filter(g => save.bosses[g.key] && save.bosses[g.key].won).length} of ${S.groups.length}. Speed nest best: ${save.speedBest}.</p>
    <div class="legend" style="margin-top:12px"><span><i class="s0c"></i>Not started</span><span><i class="s1c"></i>Just met</span><span><i class="s2c"></i>Learning</span><span><i class="s3c"></i>Nearly there</span><span><i class="s4c"></i>Memorized</span></div>
    <div class="gridwrap">${grids}</div>
    <p>${st.tricky.length ? 'Trickiest so far: ' + st.tricky.map(id => `<b>${factText(id, true)}</b> (missed ${save.facts[id].w}×)`).join(', ') + '.' : 'No missed facts yet.'}</p>
  </section>
  <section class="card"><h2>Day by day</h2>${log}</section>
  <section class="card"><h2>How it works</h2>
    <p>A fact counts as memorized when it has been answered correctly on separate days, with the last answer given quickly (under ${E.SOLID_MS / 1000} seconds for math, a little longer for spelling). Stars and levels only come from eggs moving forward, quests and boss eggs. Boss eggs and the speed nest never count toward memorizing; a miss there just brings that fact back in the next round. Missed facts come back sooner. Memorized facts are checked again after a week, then every three weeks. One round is ${E.ROUND_LEN} questions. A round a day works better than a long session once a week.</p>
    <p class="tiny">The microphone uses the browser's own speech recognition. In Chrome that sends your child's voice to Google to be turned into text. This game keeps no recordings.</p></section>
  <section class="card"><h2>Back up or move progress</h2>
    <p class="tiny" style="margin:0 0 8px">Progress lives in this browser on this computer. Copy this code somewhere safe to back it up (it covers every player). Paste a code and press Load to restore.</p>
    <textarea id="code" spellcheck="false" aria-label="Save code">${code}</textarea>
    <div class="row" style="margin:12px 0 0"><button class="btn sm" data-act="copy">Copy code</button><button class="btn sm" data-act="loadcode">Load pasted code</button><button class="btn sm" data-act="erase">${ui.arm === 'erase' ? 'Press again to erase ' + esc(save.name) + ' for good' : 'Erase this player'}</button></div>
    ${ui.note ? `<p class="tiny">${esc(ui.note)}</p>` : ''}</section>`;
}
function vCert() {
  const S = E.SUBJECTS[save.subject], st = E.stats(save, Date.now());
  const when = new Date(save.done || Date.now()).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  return `<header class="top noprint"><button class="btn sm" data-act="home">← Home</button><button class="btn sm" data-act="print">Print</button></header>
  <section class="card cert"><p class="tag">The Odd Egg Hatchery</p><h2>Certificate of Egg-cellence</h2><p>This proves that</p><p class="who2">${esc(save.name)}</p>
    <p style="font-size:1.25rem;max-width:34ch;margin:0 auto">has memorized ${S.goal}, and raised ${st.total} very odd pets along the way.</p>
    <p class="tiny">${when} · ${plural(st.days, 'day')} of hatching · ${st.q} questions answered</p>
    <div class="parade" style="margin-top:18px">${S.facts.slice(0, 55).map(f => creatureSVG(f.id, 4, { size: 54, bed: save.bed, wear: save.worn[f.id] })).join('')}</div></section>`;
}
function render() {
  const views = { welcome: vWelcome, who: vWho, home: vHome, round: vRound, summary: vSummary, book: vBook, shop: vShop, grown: vGrownups, cert: vCert, boss: vBoss, speed: vSpeed };
  app.innerHTML = views[ui.screen]();
  const auto = app.querySelector('[autofocus]');
  if (auto) auto.focus();
}

/* ---------- buttons and keys ---------- */
function go(screen) { if (inGame()) leaveGame(); ui.screen = screen; ui.detail = null; ui.more = false; ui.arm = ''; ui.note = ''; render(); }
const ACTS = {
  play: () => startRound(),
  home: () => go('home'), book: () => go('book'), shop: () => go('shop'), grown: () => go('grown'), cert: () => go('cert'), who: () => go('who'),
  addplayer: () => go('welcome'),
  pick: d => { root.cur = Number(d.i); save = root.players[root.cur]; persist(); go('home'); },
  next: () => closeOverlay(),
  sound: () => { save.sound = !save.sound; persist(); render(); if (save.sound) sfx('right'); },
  mic: () => { if (Mic.on) { Mic.stop(); save.mic = false; } else { save.mic = true; Mic.status = ''; Mic.start(); } persist(); render(); },
  pet: d => { ui.detail = d.id; render(); },
  close: () => { ui.detail = null; ui.more = false; render(); },
  more: () => { ui.more = true; render(); },
  subject: d => { E.switchSubject(save, d.subject); persist(); go('home'); },
  wear: d => { const w = save.worn[ui.detail] || (save.worn[ui.detail] = {}); if (d.item) w[d.slot] = d.item; else delete w[d.slot]; persist(); render(); },
  buy: d => { const it = ITEMS.find(x => x.id === d.item); if (it && canBuy(it)) { save.seeds -= it.price; save.owned.push(it.id); if (it.kind === 'bed') save.bed = it.id; persist(); sfx('buy'); render(); } },
  tab: d => { ui.shopTab = d.tab; render(); },
  usebed: d => { save.bed = save.bed === d.item ? '' : d.item; persist(); render(); },
  levelup: () => { const lv = E.levelInfo(save.stars).level; save.seeds += 20 * Math.max(0, lv - save.seenLevel); save.seenLevel = lv; persist(); sfx('grown'); render(); },
  boss: d => startBoss(d.key),
  speed: () => { leaveGame(); ui.speed = { phase: 'ready', score: 0 }; ui.screen = 'speed'; render(); },
  speedgo: () => speedStart(),
  say: () => sayQ(askingNow() || ui.q),
  print: () => window.print(),
  copy: () => { const t = document.querySelector('#code'); t.select(); const done = ok => { ui.note = ok ? 'Copied.' : 'Select the code and copy it by hand.'; render(); }; if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => done(true), () => done(false)); else done(false); },
  loadcode: () => {
    try {
      const raw = JSON.parse(decodeURIComponent(escape(atob(document.querySelector('#code').value.trim()))));
      const players = (raw.players || []).map(p => E.repair(p, Date.now())).filter(Boolean);
      if (!players.length) throw new Error('no players in code');
      root = { v: 1, cur: Math.min(raw.cur | 0, players.length - 1), players }; save = root.players[root.cur]; persist();
      ui.note = 'Loaded ' + plural(players.length, 'player') + '.';
    } catch (err) { ui.note = 'That code did not work. Nothing was changed.'; }
    render();
  },
  erase: () => {
    if (ui.arm !== 'erase') { ui.arm = 'erase'; render(); return; }
    root.players.splice(root.cur, 1); root.cur = 0; save = root.players[0] || null; persist();
    go(save ? 'who' : 'welcome');
  },
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'close' && b.classList.contains('veil') && e.target !== b) return;
  ACTS[b.dataset.act](b.dataset);
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const fd = new FormData(e.target), name = String(fd.get('name') || '').trim().slice(0, 16) || 'Keeper';
  save = E.newSave(Date.now(), fd.get('subject'), name);
  root.players.push(save); root.cur = root.players.length - 1; persist();
  go('home');
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.closest('input, textarea')) return;
  if (el && el.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  const q = askingNow();
  if (q) {
    const word = q.kind === 'w';
    if (word ? /^[a-zA-Z]$/.test(e.key) : /^\d$/.test(e.key)) { if (ui.typed.length < (word ? 18 : 3)) ui.typed += e.key.toLowerCase(); }
    else if (e.key === 'Backspace') { e.preventDefault(); ui.typed = ui.typed.slice(0, -1); }
    else if (e.key === 'Enter') { submitAny(); return; }
    else if (e.key === ' ' && word) { e.preventDefault(); sayQ(q); return; }
    else return;
    const box = document.querySelector('#box');
    if (box) box.textContent = ui.typed;
    return;
  }
  if (e.key === 'Escape' && (ui.detail || ui.more)) { ACTS.close(); return; }
  if (ui.more) return;
  if (ui.screen === 'round' && ui.overlay) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeOverlay(); } return; }
  if (e.key !== 'Enter' || Date.now() < ui.lock) return;
  if (ui.screen === 'round') { if (ui.phase === 'feedback') nextQ(); }
  else if (ui.screen === 'boss') { if (ui.boss.phase === 'feedback') bossNext(); else if (ui.boss.phase === 'over') go('home'); }
  else if (ui.screen === 'speed') { if (ui.speed.phase === 'ready') speedStart(); else if (ui.speed.phase === 'over') go('home'); }
  else if (ui.screen === 'home' || ui.screen === 'summary') startRound();
});
window.__hatchery = { ui, Mic, onVoice, get save() { return save; } };
render();
})();
</script>
</body>
